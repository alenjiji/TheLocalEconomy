<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>The Local Economy</title>
  <!--
    The mark from the header lockup: the cyan tile with its E.

    This is an optical cut for small sizes, not the lockup's letter. The
    wordmark is set in a Didone, whose arms are hairlines, and a hairline has
    nowhere to go at 16 pixels: rasterised down, the three arms broke into
    disconnected grey specks and the stem vanished altogether, which is why the
    tab icon read as a smudge rather than an E.

    So every stroke here is at least 7 units of the 64 — 1.75px at 16, which is
    the least that survives antialiasing with its edges intact — and the letter
    keeps the lockup's proportions instead of its weights: a tall, narrow E,
    the middle arm shorter than the other two, sitting on the brand cyan.

    The full Didone lockup is still what appears everywhere it is read at size,
    in the header and the footer. This is the same mark at the one size where
    its contrast cannot be drawn.
  -->
  <rect width="64" height="64" fill="#00adee"/>
  <g fill="#ffffff">
    <!-- Stem, full height, carrying the three arms. -->
    <rect x="17" y="12" width="8.5" height="40"/>
    <rect x="17" y="12" width="30" height="8"/>
    <rect x="17" y="28.5" width="23" height="7"/>
    <rect x="17" y="44" width="30" height="8"/>
  </g>
</svg>
